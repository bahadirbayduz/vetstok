<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5a43">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VetStok</title>
<style>
:root{--bg:#f2f5f2;--card:#fff;--tx:#14221b;--mut:#64736b;--bd:#e1e7e1;--pri:#17775a;--prit:#fff;--warn:#9a3412;--warnbg:#ffedd5;--bad:#991b1b;--badbg:#fee2e2;--ok:#166534;--okbg:#dcfce7;--sh:0 1px 3px #0001,0 6px 20px #0000000a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1411;--card:#18211c;--tx:#e8efea;--mut:#9aaaa1;--bd:#2a3630;--pri:#3fb68b;--prit:#08140f;--warn:#fdba74;--warnbg:#3a2210;--bad:#fca5a5;--badbg:#3b1414;--ok:#86efac;--okbg:#10301c;--sh:none;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#0f5a43,#17775a);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;margin-bottom:14px}
header .in{max-width:1040px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:19px;margin:0;display:flex;align-items:center;gap:10px}h1 img{height:32px;border-radius:6px}h1 small{display:block;font-size:12px;font-weight:400;opacity:.85}
#live{font-size:12px;padding:4px 10px;border-radius:999px;background:#fff3;margin-right:6px}#live.on{background:#bbf7d0;color:#14532d}
header .btn{background:#fff2;color:#fff;border:1px solid #fff4;padding:5px 12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0;font:inherit;font-size:11px;cursor:pointer;min-width:0}
nav button span{display:block;font-size:19px}nav button.on{color:var(--pri);font-weight:600}
main{max-width:1040px;margin:auto;padding:0 16px 100px}
@media(min-width:760px){nav{position:static;max-width:1008px;margin:-4px auto 14px;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}nav button{font-size:14px;padding:11px 0}nav button span{display:inline;font-size:15px;margin-right:6px}main{padding-bottom:30px}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.kpi{margin:0}.kpi b{display:block;font-size:22px;margin-top:2px}.kpi span,.mut{color:var(--mut);font-size:13px}
h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:500;font-size:12px}
.tag{padding:2px 9px;border-radius:999px;font-size:12px}.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
input,select{font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0;width:100%}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.row>*{flex:1 1 140px}
.btn{border:0;background:var(--pri);color:var(--prit);padding:11px 16px;border-radius:10px;font:inherit;cursor:pointer;width:auto}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:5px 11px}.btn.d{background:var(--badbg);color:var(--bad)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.tot{font-size:19px;font-weight:600;margin:12px 0}
.bars{display:flex;gap:6px;align-items:flex-end;height:150px}.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px}
.bar i{width:100%;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}.bar b{color:var(--mut);font-weight:400;margin-top:3px}.bar em{font-style:normal;font-size:10px;color:var(--mut)}
.hb{height:7px;background:var(--bd);border-radius:9px;margin-top:4px}.hb i{display:block;height:100%;background:var(--pri);border-radius:9px}
.login{max-width:390px;margin:10vh auto 0;text-align:center}.login input{margin-bottom:10px}.login .btn{width:100%}
#err{color:var(--bad);font-size:13px;min-height:18px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:#0f5a43;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;display:none;max-width:92vw;box-shadow:0 4px 16px #0004}
dialog{border:0;border-radius:18px;padding:20px;width:min(440px,94vw);background:var(--card);color:var(--tx);box-shadow:0 10px 40px #0006}
dialog::backdrop{background:#0008}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block;color:#000;background:#fff;padding:24px;font-size:14px}#print table{width:100%}}
</style></head>
<body>
<div id="toast"></div>
<header><div class="in" id="hd"></div></header>
<nav id="nav" style="display:none"></nav>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="print"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://ahyiqwksjryoqucwltol.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoeWlxd2tzanJ5b3F1Y3dsdG9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwODczNTMsImV4cCI6MjEwNzY2MzM1M30.T23KgiI45WYUKlEiezK0XxcBMTXqy4ad-LCQA6QXUf0";
const FIRMA="VetStok";   /* şirket adı */
const LOGO="";           /* logo dosyası adı, örn: "logo.png" (dosyayı index.html ile aynı yere yükleyin) */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const E=i=>document.getElementById(i);
const TL=n=>Number(n).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+Number(f(x)),0);
const todayS=new Date().toISOString().slice(0,10);
const daysTo=d=>d?Math.round((new Date(d)-new Date(todayS))/864e5):9999;
const ROL={yonetici:"Yönetici",satis:"Satış",depo:"Depo"};
const TABS={panel:["📊","Panel"],stok:["📦","Stok"],siparis:["🛒","Satış"],liste:["🧾","Siparişler"],musteri:["🤝","Müşteri"],kisi:["👥","Kişiler"]};
const ALLOW={yonetici:["panel","stok","siparis","liste","musteri","kisi"],satis:["panel","stok","siparis","liste","musteri"],depo:["panel","stok"]};
let me=null,P=[],O=[],M=[],U=[],C=[],Pay=[],cart=[],tab="panel",ch=null,tmr;
function toast(t){const e=E("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",4000)}
function setLive(on){const l=E("live");if(l){l.className=on?"on":"";l.textContent=on?"● Canlı":"○ Bağlantı yok"}}
const brand=()=>`${LOGO?`<img src="${esc(LOGO)}" alt="">`:"🐄"} <span>${esc(FIRMA)}`;

/* ---- Giriş ---- */
function showLogin(){E("nav").style.display="none";E("hd").innerHTML=`<h1>${brand()}</span></h1>`;
 E("app").innerHTML=`<div class="card login"><h1 style="justify-content:center;color:var(--pri)">${brand()}</span></h1><p class="mut">Stok ve satış yönetimi. Lütfen giriş yapın.</p>
 <input id="em" type="email" placeholder="E-posta" autocomplete="username"><input id="pw" type="password" placeholder="Şifre" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()">
 <div id="err"></div><button class="btn" onclick="login()">Giriş yap</button></div>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:E("em").value.trim(),password:E("pw").value});
 if(error){E("err").textContent="E-posta veya şifre hatalı";return}start()}
async function logout(){await sb.auth.signOut();me=null;showLogin()}

/* ---- Başlangıç ---- */
async function start(){
 const{data:{user}}=await sb.auth.getUser();if(!user){showLogin();return}
 const{data:pr}=await sb.from("profiles").select("*").eq("id",user.id).single();
 if(!pr){E("app").innerHTML='<div class="card">Hesabınız bulunamadı. Yöneticiye başvurun.</div>';return}
 me=pr;
 E("hd").innerHTML=`<h1>${brand()}<small>${esc(me.ad)} · ${ROL[me.rol]}</small></span></h1><span><span id="live">○ Bağlanıyor…</span><button class="btn s" onclick="logout()">Çıkış</button></span>`;
 E("nav").style.display="flex";tab="panel";nav();
 if(!ch){ch=sb.channel("canli").on("postgres_changes",{event:"*",schema:"public"},p=>{
   if(p.table=="stock_moves"&&p.eventType=="INSERT"&&p.new.kullanici!==me.id){const m=p.new;toast((m.adet<0?"🔔 Yeni satış: ":"📥 Mal kabul: ")+Math.abs(m.adet)+" × "+m.ad)}
   clearTimeout(tmr);tmr=setTimeout(loadAll,300)}).subscribe(s=>setLive(s=="SUBSCRIBED"))}
 await loadAll();go("panel")}
async function loadAll(){
 const[p,o,m,u,c,y]=await Promise.all([
  sb.from("products").select("*").order("ad"),
  sb.from("orders").select("*, order_items(*)").order("created_at",{ascending:false}).limit(500),
  sb.from("stock_moves").select("*").order("created_at",{ascending:false}).limit(8),
  sb.from("profiles").select("*").order("ad"),
  sb.from("customers").select("*").order("ad"),
  sb.from("payments").select("*").order("created_at",{ascending:false}).limit(1000)]);
 P=(p.data||[]).filter(x=>x.aktif);O=o.data||[];M=m.data||[];U=u.data||[];C=c.data||[];Pay=y.data||[];upd()}
function nav(){E("nav").innerHTML=ALLOW[me.rol].map(k=>`<button class="${k==tab?'on':''}" onclick="go('${k}')"><span>${TABS[k][0]}</span>${TABS[k][1]}</button>`).join("")}
const bal=id=>sum(O.filter(o=>o.customer_id==id&&o.odeme=="veresiye"),o=>o.toplam)-sum(Pay.filter(p=>p.customer_id==id),p=>p.tutar);

/* ---- Sekmeler ---- */
function go(t){tab=t;nav();const a=E("app"),y=me.rol=="yonetici";
 if(t=="stok")a.innerHTML=`<div class="card"><h2>Stok listesi ${y?'<button class="btn" onclick="openP()">+ Yeni ürün</button>':""}</h2><div class="row"><input id="q" placeholder="Ürün ara…" oninput="rows()"></div><div class="tw"><table><thead><tr><th>Ürün</th><th>Stok</th><th>Fiyat</th><th>SKT</th><th>Durum</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
 else if(t=="siparis")a.innerHTML=`<div class="cols"><div class="card"><h2>Yeni satış</h2>
  <div class="row"><div><label>Müşteri</label><select id="mus"></select></div><div><label>Ödeme</label><select id="odm"><option value="pesin">Peşin</option><option value="veresiye">Veresiye (cariye işle)</option></select></div></div>
  <div class="row"><div style="flex:3 1 180px"><label>Ürün</label><select id="sel"></select></div><div style="flex:1 1 70px"><label>Adet</label><input id="qty" type="number" inputmode="numeric" min="1" value="1"></div></div>
  <button class="btn" onclick="addCart()">Sepete ekle</button></div><div class="card"><h2>Sepet</h2><div id="cart"></div></div></div>`;
 upd()}
function upd(){if(!me)return;const a=E("app");
 if(tab=="panel")a.innerHTML=panel();else if(tab=="stok")rows();
 else if(tab=="siparis"){fillSel();cartView()}else if(tab=="liste")a.innerHTML=liste();
 else if(tab=="musteri")a.innerHTML=musteri();else if(tab=="kisi")a.innerHTML=kisi()}
function stat(p){const d=daysTo(p.skt);
 if(d<0)return['bad','SKT geçti'];if(p.stok<=0)return['bad','Tükendi'];if(p.stok<p.min_stok)return['warn','Kritik stok'];if(d<=90)return['warn','SKT yakın'];return['ok','Yeterli']}

/* ---- Panel + raporlar ---- */
function panel(){
 const low=P.filter(p=>p.stok<p.min_stok),exp=P.filter(p=>daysTo(p.skt)<=90),now=new Date();
 const same=(a,b)=>new Date(a).toDateString()==b.toDateString();
 const ts=sum(O.filter(o=>same(o.created_at,now)),o=>o.toplam);
 const ay=sum(O.filter(o=>{const d=new Date(o.created_at);return d.getMonth()==now.getMonth()&&d.getFullYear()==now.getFullYear()}),o=>o.toplam);
 const val=sum(P,p=>p.stok*p.fiyat),alacak=sum(C.map(c=>bal(c.id)).filter(b=>b>0),b=>b);
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
 const sums=days.map(d=>sum(O.filter(o=>same(o.created_at,d)),o=>o.toplam)),mx=Math.max(...sums,1);
 const agg={};O.filter(o=>new Date(o.created_at)>Date.now()-30*864e5).forEach(o=>(o.order_items||[]).forEach(k=>{agg[k.ad]=(agg[k.ad]||0)+k.adet}));
 const top=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,5),tmax=top.length?top[0][1]:1;
 return `<div class="grid"><div class="card kpi"><span>Bugünkü satış</span><b>${TL(ts)}</b></div><div class="card kpi"><span>Bu ay satış</span><b>${TL(ay)}</b></div><div class="card kpi"><span>Stok değeri</span><b>${TL(val)}</b></div><div class="card kpi"><span>Toplam alacak (veresiye)</span><b>${TL(alacak)}</b></div></div>
 <div class="cols"><div class="card"><h2>📈 Son 7 gün satış</h2><div class="bars">${days.map((d,i)=>`<div class="bar"><em>${sums[i]?Math.round(sums[i]):""}</em><i style="height:${sums[i]/mx*100}%"></i><b>${d.toLocaleDateString("tr-TR",{weekday:"short"})}</b></div>`).join("")}</div></div>
 <div class="card"><h2>🏆 En çok satanlar (30 gün)</h2>${top.map(([n,q])=>`<div style="margin-bottom:9px"><div class="li" style="border:0;padding:0"><span>${esc(n)}</span><b>${q}</b></div><div class="hb"><i style="width:${q/tmax*100}%"></i></div></div>`).join("")||'<span class="mut">Henüz satış yok</span>'}</div>
 <div class="card"><h2>⚠️ Kritik stok</h2>${low.map(p=>`<div class="li"><span>${esc(p.ad)}</span><span class="tag warn">${p.stok} / min ${p.min_stok}</span></div>`).join("")||'<span class="mut">Yok</span>'}</div>
 <div class="card"><h2>⏳ SKT yaklaşanlar</h2>${exp.map(p=>`<div class="li"><span>${esc(p.ad)}</span><span class="tag ${daysTo(p.skt)<0?'bad':'warn'}">${daysTo(p.skt)} gün</span></div>`).join("")||'<span class="mut">Yok</span>'}</div>
 <div class="card"><h2>🔄 Son stok hareketleri</h2>${M.map(m=>`<div class="li"><span>${m.adet>0?'📥':'📤'} ${esc(m.ad)}</span><b>${m.adet>0?'+':''}${m.adet}</b></div>`).join("")||'<span class="mut">Henüz hareket yok</span>'}</div></div>`}

/* ---- Stok ---- */
function rows(){const tb=E("tb");if(!tb)return;const q=(E("q")||{value:""}).value.toLowerCase(),y=me.rol=="yonetici",g=y||me.rol=="depo";
 tb.innerHTML=P.filter(p=>(p.ad+p.kat).toLowerCase().includes(q)).map(p=>{const[c,t]=stat(p);
 return `<tr><td>${esc(p.ad)}<div class="mut">${esc(p.kat)}</div></td><td><b>${p.stok}</b></td><td>${TL(p.fiyat)}</td><td>${p.skt||"-"}</td><td><span class="tag ${c}">${t}</span></td><td>${g?`<button class="btn s" onclick="recv('${p.id}')">+ Giriş</button> `:""}${y?`<button class="btn s" onclick="openP('${p.id}')">Düzenle</button>`:""}</td></tr>`}).join("")}
async function recv(id){const v=parseInt(prompt("Kaç adet mal kabul edildi?","10"));if(!(v>0))return;
 const{error}=await sb.rpc("receive_stock",{p_id:id,p_adet:v});if(error)alert(error.message);else{toast("Stok girişi yapıldı ✓");loadAll()}}
function openP(id){const p=id?P.find(x=>x.id==id):{ad:"",kat:"",stok:0,min_stok:0,fiyat:"",skt:""};
 E("dbody")?0:0;E("dlg").innerHTML=`<h2>${id?"Ürünü düzenle":"Yeni ürün"}</h2>
 <div class="row"><div style="flex:1 1 100%"><label>Ürün adı</label><input id="p_ad" value="${esc(p.ad)}"></div><div><label>Kategori</label><input id="p_kat" value="${esc(p.kat)}"></div><div><label>Fiyat ₺</label><input id="p_fiyat" type="number" inputmode="decimal" value="${p.fiyat}"></div>
 <div><label>${id?"Mevcut stok (+Giriş ile değişir)":"Başlangıç stoğu"}</label><input id="p_stok" type="number" inputmode="numeric" value="${p.stok}" ${id?"disabled":""}></div><div><label>Min. stok</label><input id="p_min" type="number" inputmode="numeric" value="${p.min_stok}"></div><div><label>Son kullanma tarihi</label><input id="p_skt" type="date" value="${p.skt||""}"></div></div>
 <div class="row"><button class="btn" onclick="saveP('${id||""}')">Kaydet</button><button class="btn s" onclick="E('dlg').close()">Vazgeç</button>${id?`<button class="btn d" onclick="delP('${id}')">Ürünü sil</button>`:""}</div>`;E("dlg").showModal()}
async function saveP(id){const g=i=>E(i).value;if(!g("p_ad")||g("p_fiyat")===""){alert("Ürün adı ve fiyat gerekli");return}
 const d={ad:g("p_ad"),kat:g("p_kat")||"Diğer",fiyat:+g("p_fiyat"),min_stok:+g("p_min")||0,skt:g("p_skt")||null};
 const r=id?await sb.from("products").update(d).eq("id",id):await sb.from("products").insert({...d,stok:+g("p_stok")||0});
 if(r.error){alert(r.error.message);return}E("dlg").close();toast("Ürün kaydedildi ✓");loadAll()}
async function delP(id){if(!confirm("Bu ürün listeden kaldırılsın mı? (Geçmiş satış kayıtları korunur)"))return;
 const{error}=await sb.from("products").update({aktif:false}).eq("id",id);if(error){alert(error.message);return}E("dlg").close();toast("Ürün kaldırıldı");loadAll()}

/* ---- Satış ---- */
function fillSel(){const s=E("sel"),m=E("mus");if(!s)return;const v=s.value,mv=m.value;
 s.innerHTML=P.map(p=>`<option value="${p.id}">${esc(p.ad)} (stok: ${p.stok})</option>`).join("");if(v)s.value=v;
 m.innerHTML='<option value="">Perakende / adsız</option>'+C.map(c=>`<option value="${c.id}">${esc(c.ad)}</option>`).join("");m.value=mv}
function addCart(){const id=E("sel").value,q=+E("qty").value,p=P.find(x=>x.id==id);if(!p||!(q>0))return;
 const inC=(cart.find(c=>c.id==id)||{q:0}).q;if(inC+q>p.stok){alert("Yetersiz stok! Mevcut: "+p.stok);return}
 const c=cart.find(x=>x.id==id);c?c.q+=q:cart.push({id,q});cartView()}
function cartView(){const el=E("cart");if(!el)return;cart=cart.filter(c=>P.find(p=>p.id==c.id));
 if(!cart.length){el.innerHTML='<span class="mut">Sepet boş</span>';return}
 const pp=c=>P.find(p=>p.id==c.id),t=sum(cart,c=>c.q*pp(c).fiyat);
 el.innerHTML=cart.map((c,i)=>`<div class="li"><span>${c.q} × ${esc(pp(c).ad)}</span><span>${TL(c.q*pp(c).fiyat)} <button class="btn s" onclick="cart.splice(${i},1);cartView()">✕</button></span></div>`).join("")+`<div class="tot">Toplam: ${TL(t)}</div><button class="btn" onclick="finish()">Satışı tamamla</button>`}
async function finish(){const cid=E("mus").value,od=E("odm").value;
 if(od=="veresiye"&&!cid){alert("Veresiye satış için müşteri seçin");return}
 const name=cid?C.find(c=>c.id==cid).ad:"Perakende";
 const{error}=await sb.rpc("create_sale",{p_musteri:name,p_items:cart.map(c=>({id:c.id,adet:c.q})),p_customer:cid?+cid:null,p_odeme:od});
 if(error){alert(error.message);await loadAll();return}
 cart=[];toast("Satış kaydedildi, stok güncellendi ✓");await loadAll();go("liste")}

/* ---- Siparişler ---- */
function liste(){return `<div class="card"><h2>Siparişler</h2><div class="tw"><table><thead><tr><th>No</th><th>Tarih</th><th>Müşteri</th><th>Ürünler</th><th>Toplam</th><th>Ödeme</th><th>Durum</th><th></th></tr></thead><tbody>${O.slice(0,200).map(o=>`<tr><td>#${o.id}</td><td>${new Date(o.created_at).toLocaleString("tr-TR",{dateStyle:"short",timeStyle:"short"})}</td><td>${esc(o.musteri)}</td><td>${(o.order_items||[]).map(k=>k.adet+"× "+esc(k.ad)).join(", ")}</td><td>${TL(o.toplam)}</td><td><span class="tag ${o.odeme=="veresiye"?"warn":"ok"}">${o.odeme=="veresiye"?"Veresiye":"Peşin"}</span></td><td><select style="width:auto" onchange="setD(${o.id},this.value)">${["Hazırlanıyor","Yolda","Teslim edildi"].map(d=>`<option ${d==o.durum?'selected':''}>${d}</option>`).join("")}</select></td><td><button class="btn s" onclick="prn(${o.id})">🖨 Fiş</button></td></tr>`).join("")||'<tr><td colspan="8" class="mut">Henüz sipariş yok</td></tr>'}</tbody></table></div></div>`}
async function setD(id,d){const{error}=await sb.from("orders").update({durum:d}).eq("id",id);if(error)alert(error.message)}
function prn(id){const o=O.find(x=>x.id==id);
 E("print").innerHTML=`<h2>${esc(FIRMA)}</h2><p>Sipariş / Satış Fişi #${o.id}<br>Tarih: ${new Date(o.created_at).toLocaleString("tr-TR")}<br>Müşteri: ${esc(o.musteri)}<br>Ödeme: ${o.odeme=="veresiye"?"Veresiye":"Peşin"}</p>
 <table border="1" cellspacing="0" cellpadding="6"><tr><th>Ürün</th><th>Adet</th><th>Birim</th><th>Tutar</th></tr>${(o.order_items||[]).map(k=>`<tr><td>${esc(k.ad)}</td><td>${k.adet}</td><td>${TL(k.fiyat)}</td><td>${TL(k.adet*k.fiyat)}</td></tr>`).join("")}</table><h3>Genel toplam: ${TL(o.toplam)}</h3>`;
 window.print()}

/* ---- Müşteriler / cari ---- */
function musteri(){const rows=C.map(c=>({c,b:bal(c.id)}));
 return `<div class="card"><h2>Müşteriler ve cari hesap <button class="btn" onclick="openC()">+ Yeni müşteri</button></h2><p class="mut">Bakiye = veresiye satışlar − yapılan tahsilatlar. Kırmızı: müşterinin borcu var.</p>
 ${rows.map(({c,b})=>`<div class="li"><span><b>${esc(c.ad)}</b><div class="mut">${esc(c.tel||"")} ${esc(c.adres||"")}</div></span><span style="text-align:right"><span class="tag ${b>0?'bad':'ok'}">${b>0?"Borç: ":"Bakiye: "}${TL(Math.abs(b))}</span><br><button class="btn s" style="margin-top:5px" onclick="payC(${c.id})">+ Tahsilat</button></span></div>`).join("")||'<span class="mut">Henüz müşteri yok</span>'}</div>`}
function openC(){E("dlg").innerHTML=`<h2>Yeni müşteri</h2><div class="row"><div style="flex:1 1 100%"><label>Ad / unvan</label><input id="c_ad"></div><div><label>Telefon</label><input id="c_tel" type="tel"></div><div><label>Adres</label><input id="c_adr"></div></div>
 <div class="row"><button class="btn" onclick="saveC()">Kaydet</button><button class="btn s" onclick="E('dlg').close()">Vazgeç</button></div>`;E("dlg").showModal()}
async function saveC(){if(!E("c_ad").value.trim()){alert("Ad gerekli");return}
 const{error}=await sb.from("customers").insert({ad:E("c_ad").value.trim(),tel:E("c_tel").value,adres:E("c_adr").value});
 if(error){alert(error.message);return}E("dlg").close();toast("Müşteri eklendi ✓");loadAll()}
async function payC(id){const v=parseFloat((prompt("Tahsil edilen tutar (₺)?")||"").replace(",","."));if(!(v>0))return;
 const{error}=await sb.from("payments").insert({customer_id:id,tutar:v,kullanici:me.id});if(error)alert(error.message);else{toast("Tahsilat kaydedildi ✓");loadAll()}}

/* ---- Kişiler (yetkiler) ---- */
function kisi(){return `<div class="card"><h2>Kullanıcılar ve yetkiler</h2><p class="mut">Yeni kullanıcıyı Supabase panelinden (Authentication → Users → Add user) ekleyin; burada yetkisini seçin.</p>${U.map(u=>`<div class="li"><span>${esc(u.ad)}</span><select style="width:auto" onchange="setR('${u.id}',this.value)">${Object.entries(ROL).map(([k,v])=>`<option value="${k}" ${k==u.rol?'selected':''}>${v}</option>`).join("")}</select></div>`).join("")}</div>`}
async function setR(id,r){const{error}=await sb.from("profiles").update({rol:r}).eq("id",id);if(error)alert(error.message);else toast("Yetki güncellendi ✓")}

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
sb.auth.getSession().then(({data:{session}})=>session?start():showLogin());
</script></body></html>
